# ci/policy/policy.yaml — declarative CI policy.
#
# Thresholds, allowlists and exemptions live HERE, not scattered through gate code,
# for the same reason ADR-0012 puts tool authorization in config: a policy you can
# read as a diff is a policy that gets reviewed.
#
# Every exemption must carry an owner and an expiry condition. An exemption with no
# route to removal is not an exemption, it is a silently lowered standard.

version: 1
# Documentary only -- no gate reads this. It said "0" from the 1.0.0 freeze until
# 2026-08-28, through G0's sign-off and the whole of Phase 1: a claim about the
# repository, in the repository's own policy file, wrong for eighteen days because
# nothing read it and nothing checked it. Moved to "2" when G1 was signed
# (Phase1_Final_Signoff.md §7). If it goes stale again the fix is to delete it, not
# to correct it -- a field nobody reads has no business asserting anything.
phase: "2"

repository:
  # Phase 0 forbids runtime code. This is the single loudest architectural signal
  # in the repo and it is machine-checked (ADR: MASTER_PLAN_v2 Phase 0).
  # LIFTED at architecture 1.6.0. G0 was signed off on 2026-08-10
  # (Phase0_Final_Signoff.md; Phase1_Entry_Checklist.md 9/9, 0 blocking), and STRUCT-004's
  # own fix text names this as the way to lift it: "sign off G0 and update
  # `repository.runtime_code_forbidden_until`". Setting it back to a gate name re-arms the
  # ban -- which is the right move if a later phase ever needs a code freeze again.
  #
  # STRUCT-004 is now dormant, not deleted. `structure` keeps its self-test coverage
  # through STRUCT-003 (forbidden_paths), because a gate that has never rejected anything
  # is unproven whichever of its rules is currently reachable.
  runtime_code_forbidden_until: null
  runtime_code_globs: ["src/lionel/**/*.py"]

  required_paths:
    - MASTER_PLAN_v2.md
    - README.md
    - artifacts.lock.yaml
    - Artifact_Verification_Report.md
    - .gitattributes
    - .gitignore
    - contracts/MANIFEST.json
    - contracts/README.md
    - contracts/Contract_Inventory.md
    - docs/decisions/README.md
    - docs/LATENCY_BUDGET.md
    - ci/policy/policy.yaml
    # ADR-0032: the dev-tooling MCP manifest. Existence is this gate's business;
    # gate_mcp checks the contents. Without this line a deleted manifest would
    # disarm gate_mcp silently — it would simply have nothing to check.
    - .mcp.json

  required_dirs:
    - contracts/core/v1
    - contracts/mcp/v1
    - contracts/events/v1
    - contracts/media/v1
    - contracts/grpc/v1
    - docs/decisions
    - config/tiers
    - config/policy
    - ci/gates
    - scripts

  # ADR-0011 abolished shell execution. Its absence is a decision, so it is checked.
  forbidden_paths:
    - path: src/lionel/capabilities/shell
      why: "ADR-0011 abolished arbitrary shell execution. This directory must never exist."
    # MASTER_PLAN.md is intentionally retained as a POINTER STUB. It reduces ambiguity
    # rather than creating it: a stale reference lands on a file that says which document
    # is authoritative, instead of silently reading a superseded plan.

adr:
  dir: docs/decisions
  expected_count: 41
  required_sections: ["## Context", "## Decision", "## Consequences", "## Alternatives Rejected", "## Verification"]
  valid_statuses: ["Accepted", "Provisional", "Superseded", "Proposed", "Deprecated"]
  # ── ADR-0029: Errata / Amendments / Corrections ──────────────────────────
  # An Accepted ADR's Decision is immutable; three append-only operations may modify the
  # document. ADR-009 checks the SHAPE of those sections. It cannot check the substance —
  # whether a correction is really a correction is a human judgement, and a gate claiming
  # otherwise would be worse than no gate.
  errata_sections: ["Erratum", "Correction", "Amendment"]
  # ADR-0029 rule 2: an Erratum quotes verbatim what it corrects. Enforced only from the
  # date ADR-0029 was Accepted. ADR-0017's Correction (2026-08-02) paraphrases rather than
  # quotes, and the fix — adding the quote — would mean editing the body of an Accepted
  # ADR, which rule 1 forbids. Enforcing it backwards would leave ADR-009 permanently red
  # with no permitted fix. See ADR-0029's Amendment of 2026-08-11.
  errata_quote_required_from: "2026-08-11"

  # ADR-0004 is a superseded record and intentionally has a different shape.
  shape_exempt:
    - id: "0004"
      why: "Superseded record. Uses Original Context / Original Decision / Why It Was Superseded / What Carried Forward."
      owner: architecture

contracts:
  dir: contracts
  manifest: contracts/MANIFEST.json
  required_x_lionel: [version, adr, stability, plane, owner, producer, consumers, compatibility]
  required_compatibility: [since, breaking_changes, notes]
  valid_planes: [control, data, internal]
  valid_stability: [stable, provisional, deprecated]
  valid_owners: [core-orchestration, brain, memory, capabilities, sensory, platform, observability]
  ulid_pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"

artifacts:
  lockfile: artifacts.lock.yaml
  valid_tiers: [A, B, C, D, E]
  # `local-registry-inspect` is distinct from `registry-manifest`: the digest was
  # obtained by the operator's own toolchain performing the OCI token exchange and
  # TLS verification, not by reading a public API response. Stronger claim, own value.
  valid_provenance: [host-published-lfs, registry-manifest, local-registry-inspect,
                     vcs-commit, git-blob-sha1, local-tofu, pinned-model-id, project-produced]
  # Tier D is a single uncorroborated mirror. Allowed, but never silently.
  max_tier_d: 1
  require_blocker_classification: true
  require_reproducible_alternative: true

docker:
  # ADR-0013. A tag is a mutable pointer; only a digest is a pin.
  require_digest: true
  digest_pattern: "^sha256:[0-9a-f]{64}$"
  forbid_tags: ["latest", "main", "master", "dev", "edge", "stable"]

placeholders:
  # ADR-0013: a fabricated value that looks real is worse than an absent one.
  forbidden_tokens: ["PENDING", "CHANGEME", "REPLACEME", "XXXXXX", "<pinned-tag>"]
  # UNRESOLVED is a legitimate, documented state — not a placeholder.
  allowed_tokens: ["UNRESOLVED", "NOT_YET_BUILT"]

todo:
  # ROOT CAUSE of the 33 no-todo failures: the old rule matched the WORD, not the
  # MARKER. `TODO-001` is a rule identifier; "a TODO comment" is prose. Neither is a
  # deferred task. A marker is comment-introduced or followed by task punctuation.
  # This alone removed 66 of 71 hits without weakening detection — verified against
  # `# TODO: x`, `// TODO(name)`, `# FIXME: y`, all still caught.
  marker_patterns:
    # `*` deliberately NOT a comment introducer here: in markdown it is emphasis,
    # and `**TODO-001**` is a bold rule identifier, not a task marker.
    - "(?:#|//|<!--|;)\\s*(TODO|FIXME|HACK|XXX)\\b"
    - "\\b(TODO|FIXME|HACK|XXX)\\s*[:(\\[]"
  # ── Document classification — Category B engineering review, 2026-08-03 ──────
  # A blanket `*.md` exclusion was REJECTED. It would have silenced the gate in
  # README.md, MASTER_PLAN_v2.md, the ADR index and every product document — the
  # places where a TODO is a real deferred promise to a reader.
  #
  # Instead each document is classified by WHAT IT IS, and the gate applies to the
  # three classes where a TODO means unfinished work:
  #
  #   architecture           APPLIES — a TODO is a deferred design decision
  #   executable policy      APPLIES — a TODO is unenforced policy. Strongest case
  #   product documentation  APPLIES — a TODO is an unfinished promise to a reader
  #   generated audit        excluded — see per-file justification below
  #   temporary review       excluded — see per-file justification below
  #
  # The two excluded classes share one property that none of the others has: the
  # documents are RECORDS OF FINDINGS, and TODO governance is their subject matter.
  # They quote the token in order to discuss the rule. A record cannot contain a
  # deferred task about itself.
  # ── Category B outcome: ZERO document exclusions are required ────────────────
  # The engineering review classified every failing document and then found the
  # exclusions unnecessary: the failures were a DETECTOR defect, not a scoping problem.
  # Fixing the pattern cleared all 33 hits. An exclusion that turns out to be
  # unneeded is removed, not kept "just in case" — so this list is empty by result,
  # not by omission.
  #
  #   classified as | verdict
  #   architecture           | gate APPLIES — a TODO is a deferred design decision
  #   executable policy      | gate APPLIES — a TODO is unenforced policy
  #   product documentation  | gate APPLIES — a TODO is an unfinished promise
  #   generated audit        | gate APPLIES — no longer hits after the detector fix
  #   temporary review       | gate APPLIES — no longer hits after the detector fix
  document_class_exclusions: []
  # Exclusions REMOVED by this review (previously blanket, never justified):
  #   Policy_Gates.md, CI_Inventory.md, CI_Architecture.md were skipped by an
  #   undocumented suffix rule in gate_no_todo.py. That silenced the gate across one
  #   architecture document and two product documents — exactly the classes where a
  #   TODO is a real deferred promise. After the detector fix none of the three hits,
  #   so the gate now APPLIES to them. This review strengthened the gate here.
  # ── end classification ──────────────────────────────────────────────────────
  #
  # A registered TODO carries an owner and the gate that removes it.
  # An unregistered TODO fails the build. An entry with no unblocked_by is rejected.
  registry:
    - pattern: "TODO wire runner"
      path_glob: ".github/workflows/ci.yml"
      owner: platform
      unblocked_by: "M3 — replaced by real gates in this milestone"
    - pattern: "TODO"
      path_glob: ".github/workflows/ci.yml"
      owner: platform
      unblocked_by: "G6 — L0 conformance needs the sensory harness to exist"

secrets:
  # NO PATH EXCLUSIONS. Every file in the repository is scanned, including ci/.
  # See Secret_Scanning_Design.md for why this is now possible.
  #
  # Each pattern declares:
  #   regex            the detector
  #   sample_parts     fragments that JOIN into a matching credential at runtime.
  #                    Never a literal — the separators here break the pattern, and
  #                    SEC-SELF-SPEC proves it on every run.
  #   negative_sample  a near-miss that MUST NOT match, so a regex loosened by a
  #                    typo (e.g. a stray `?`) fails loudly instead of silently
  #                    matching everything.
  patterns:
    - id: SEC-AWS
      regex: "AKIA[0-9A-Z]{16}"
      label: "AWS access key id"
      sample_parts: ["AKIA", "IOSFODNN7EXAMPLE"]
      negative_sample: "AKIA-not-a-key"
    - id: SEC-GH
      regex: "gh[pousr]_[A-Za-z0-9]{36,}"
      label: "GitHub token"
      sample_parts: ["ghp", "_", "0123456789abcdefghijABCDEFGHIJklmnop12"]
      negative_sample: "ghp_short"
    - id: SEC-ANTHROPIC
      regex: "sk-ant-[A-Za-z0-9_\\-]{20,}"
      label: "Anthropic API key"
      sample_parts: ["sk-ant-", "0123456789abcdefghijABCDEF"]
      negative_sample: "sk-ant-tooshort"
    - id: SEC-OPENAI
      regex: "sk-[A-Za-z0-9]{32,}"
      label: "OpenAI-style key"
      sample_parts: ["sk-", "0123456789abcdefghijABCDEFGHIJ0123456"]
      negative_sample: "sk-tooshort"
    - id: SEC-PEM
      regex: "-----BEGIN [A-Z ]*PRIVATE KEY-----"
      label: "private key"
      sample_parts: ["-----BEGIN ", "RSA PRIVATE KEY-----"]
      negative_sample: "-----BEGIN CERTIFICATE-----"
    - id: SEC-SLACK
      regex: "xox[baprs]-[A-Za-z0-9-]{10,}"
      label: "Slack token"
      sample_parts: ["xox", "b-", "0123456789abcdef"]
      negative_sample: "xoxb-short"

  # ADR-0015: config references secrets by URI, never by value.
  require_secret_uri_scheme: "^secret://(env|file|dpapi|k8s)/[A-Za-z0-9_./-]+$"
  forbid_env_interpolation: true

licenses:
  allow:
    - MIT
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - ISC
    - MPL-2.0
    - Unlicense
    - CC0-1.0
    - project-owned
  # Flagged rather than blocked: correct for personal use, a problem if distributed.
  # Licences genuinely unresolved upstream. Same contract as todo.registry: an owner and
  # the gate that closes it. Deferred is acceptable; forgotten is not.
  unresolved_registry:
    - artifact: models.wake_bootstrap
      owner: sensory
      resolve_by: "G6a"
      why: "openWakeWord model licence is ambiguous (NC vs Apache). Self-liquidating — ADR-0023 replaces this model."
  review_required:
    - id: CC-BY-NC-SA-4.0
      why: "Non-commercial. Fine for personal use; blocks distribution."
    - id: GPL-3.0
      why: "Strong copyleft. Would impose obligations on the whole project."
    - id: AGPL-3.0
      why: "Network copyleft. Incompatible with shipping a service without source release."
  # A review_required licence that HAS been reviewed. ADR-0031.
  #
  # Without this, `review_required` has no exit: the gate asks the same question on every
  # run and the only ways to silence it are to delete the licence identifier or to widen
  # `allow`. Both destroy the information. This records the ruling instead — who made it,
  # what it permits, and when it must be re-made — so the constraint travels with the
  # artifact rather than living in someone's memory.
  #
  # `scope` is the operative field. It is NOT an approval of the artifact; it is an
  # approval of a specific USE of it. LIC-006 polices these entries, exactly as LIC-005
  # polices the unresolved registry: an owner and a route to removal, or it is not an
  # exemption.
  review_accepted:
    - artifact: models.piper_tr_dfki
      license: CC-BY-NC-SA-4.0
      owner: sensory
      scope: "personal use only — NOT distributable, NOT commercial"
      revisit_at: "G6c"
      why: >-
        The ONLY Turkish voice in rhasspy/piper-voices (ADR-0017 correction, 2026-08-02);
        the repo is MIT but this voice's MODEL_CARD is CC-BY-NC-SA-4.0 via the DFKI-OT
        dataset. ADR-0023 makes Turkish first-class and G6c's DoD requires the Turkish
        voice loop to pass, so removing it is not free. Personal use is unaffected;
        distribution is blocked until the voice is replaced. Tracked in
        Architecture_Risk_Register.md.
    - artifact: models.piper_tr_dfki_config
      license: CC-BY-NC-SA-4.0
      owner: sensory
      scope: "personal use only — NOT distributable, NOT commercial"
      revisit_at: "G6c"
      why: "Inherits the voice licence and resolves with it."

# ── gate self-test coverage ────────────────────────────────────────────────────
# CI_Architecture.md §7 step 6: "a gate that has never rejected anything is unproven."
# gate-coverage enforces it. Same contract as todo.registry and licenses.unresolved_registry:
# an owner and the gate that closes it, or it is not an exemption.
#
# EMPTY IS THE CORRECT STATE. Every gate in ORDER plants a violation in ci/self_test.sh.
# An entry here is a gate that has never proven it can reject anything.
# ── ADR-0032: developer-tooling MCP servers ─────────────────────────────────
# Declared, pinned, egress-disclosed, credential-free. `.mcp.json` is NOT in the
# architecture checksum set: it is workstation tooling, not architecture, and the
# ADR is emphatic that it never becomes a runtime or CI dependency.
mcp:
  manifest: .mcp.json

  # Commands that resolve a package from a registry at launch. `npx -y <pkg>` takes
  # whatever is newest at the moment someone opens their editor, which is precisely
  # the failure ADR-0013 names: "a rebuild in three months produces a different system".
  npm_style_commands: ["npx", "bunx", "pnpm", "npm", "yarn"]
  python_style_commands: ["uvx", "pipx"]
  require_exact_pin: true          # name@1.2.3 · pkg==1.2.3. Ranges and `latest` are not pins.
  require_egress_note: true        # x-lionel.egress — what leaves the machine, and to whom.

  # ADR-0015 forbids interpolated credentials, and gate_secrets scans this file with no
  # path exclusions. A key here is a committed key.
  credential_key_regex: "(?i)(api[-_]?key|access[-_]?key|token|secret|password|passwd|credential|authorization|bearer)"
  # A value that is only an environment reference is not a credential.
  credential_value_allowed: ['^\$\{[A-Za-z_][A-Za-z0-9_]*\}$', '^secret://', '^$']

  # ADR-0032's standing criterion: `.mcp.json` holds one entry, and a second is a
  # decision rather than a routine addition. Reported as a NOTE on every run and never
  # as a violation — blocking it would settle by implementation a question the ADR
  # deliberately left to a reviewer.
  standing_entry_count: 1

# -- ADR-0030: the counts this repository states about itself ----------------
# `generated-docs` covers documents that HAVE a generator. Everything else asserting a
# count is hand-written prose, and ADR-0030's Costs section records that as open. Four
# stale claims surfaced while architecture 1.4.0 was being prepared, one of them under a
# heading reading "Verify before you claim anything".
#
# The registry names WHERE current-state claims live; the gate measures WHETHER they are
# true. Most numbers in this repository are supposed to be stale -- Architecture_Freeze.md
# section 9.x and the sign-off's evidence tables are dated records, and this project appends
# corrections rather than rewriting history. A gate that flagged those would be arguing
# with the archive.
doc_claims:
  patterns:
    - id: gates
      regex: '(\d+) gates'
      fact: gates
    - id: gates-ratio
      regex: '(\d+)/(\d+)(?:,| ) *(?:0 broken|gates covered)'
      fact: gates
    - id: rules
      regex: '(\d+) rules'
      fact: rules
    - id: jobs
      regex: '(\d+) (?:workflow |CI )?jobs'
      fact: jobs
    # The negative lookahead keeps this off `0 ADRs pending`, which belongs to
    # `pending-adrs` below. Without it the first pattern wins and reports the ADR
    # count against a pending count -- two true numbers, compared to each other.
    - id: adrs
      regex: '(\d+) ADRs(?! pending)'
      fact: adrs
    - id: selftest
      regex: '[Ss]elf-test (\d+)/(\d+)'
      fact: assertions
    - id: assertions-ratio
      regex: '(\d+)/(\d+) assertions'
      fact: assertions
    - id: policy-sections
      regex: '(\d+) configuration sections'
      fact: policy_sections
    # A status claim, not a count -- and it went wrong the same way a count does.
    # `1 pending: ADR-0035` stood in Architecture_Freeze.md §3 through three tags
    # after ADR-0035 was accepted, inside a region this gate already reads. Both
    # phrasings the documents actually use are covered.
    - id: pending-adrs
      regex: '(\d+) ADRs? pending'
      fact: pending_adrs
    - id: pending-colon
      regex: '(\d+) pending[:,]'
      fact: pending_adrs

  documents:
    - doc: CLAUDE.md
      region: null                       # the whole file
      historical:
        - line: "They drifted to 16 gates against 17, 88 rules against 127"
          why: "A dated account of the drift that motivated the generator. Its numbers are
                the point; correcting them would delete the evidence."
          owner: architecture
    - doc: CI_Architecture.md
      region: "## 8. Current state"
    - doc: Architecture_Freeze.md
      region: "## 3. Frozen scope"

  # Left out, deliberately and with an owner. Both interleave current claims with dated
  # records line by line -- Phase1_Entry_Checklist.md carries "Counts when this item landed"
  # two lines above "Current:" -- so bringing them in needs document surgery, not a gate.
  out_of_scope:
    - doc: Phase1_Entry_Checklist.md
      why: "Per-item records and current-state claims are interleaved; separating them means
            restructuring the document."
      owner: architecture
      unblocked_by: "splitting the current-state table into its own section, then registering it"
    # Moved here from `documents` on 2026-09-02, the day section 7 was signed -- which is
    # the transition its own section 8 describes. It was registered WHILE UNSIGNED, and
    # deliberately: Phase1_Final_Signoff.md stated the same counts in an aligned block that
    # matched no pattern, sat unsigned across four versions, and went stale inside itself
    # (Architecture_Freeze.md 9.19). Registration is for a document whose numbers must track
    # the present; a signed one's must not.
    - doc: Phase2_Final_Signoff.md
      why: >-
        A dated audit record, signed by Efe on 2026-09-02. Its numbers describe what
        was true at sign-off and must not move. It was registered under `documents`
        for the five days it was unsigned, which is why they were still true on the
        day it was signed.
      owner: architecture
      unblocked_by: >-
        nothing -- correct as an exclusion now that it is signed, and listed so the
        omission is visible rather than implied.
    - doc: Phase1_Final_Signoff.md
      why: >-
        A dated audit record, signed by Efe on 2026-08-28. Its numbers describe
        what was true at sign-off and must not move. Until that day it was
        unsigned, its numbers were current-state claims, and they went stale
        across four versions before anyone looked -- which is the reason this
        entry exists rather than the document simply being absent from the file.
      owner: architecture
      unblocked_by: >-
        nothing -- correct as an exclusion now that it is signed, and listed so
        the omission is visible rather than implied.
    - doc: Phase0_Final_Signoff.md
      why: "A dated audit record. Its numbers describe what was true at sign-off and must
            not move."
      owner: architecture
      unblocked_by: "nothing -- this one is correct as an exclusion, and is listed so the
                     omission is visible rather than implied"
    - doc: Architecture_Risk_Register.md
      why: "Status and severity claims, not counts. The doc-claim-auditor agent covers them;
            a gate would need to evaluate whether a risk is closed."
      owner: architecture
      unblocked_by: "a rule that can read a risk's closure evidence, if one is ever possible"

coverage:
  exempt: []

dependencies:
  manifest: pyproject.toml
  require_version_bounds: true
  forbid_packages:
    - name: requests
      why: "httpx is already a dependency. Two HTTP clients is drift, not choice."
    - name: httpx2
      why: "httpx is already a dependency. Two HTTP clients is drift, not choice --
            true whether the second one shares httpx's name or not."
  require_lockfile: uv.lock
  lockfile_required_at: "G1"
  # DEP-003. A forbidden package that arrives as somebody else's dependency is
  # invisible to DEP-002, which reads pyproject.toml. It is not automatically
  # wrong -- DEP-002 is about which client OUR code calls -- but it must be a
  # decision on the record rather than something the resolver did quietly.
  transitive_exemptions:
    - package: requests
      pulled_by: fastembed
      why: >-
        fastembed depends on requests directly, for model download from the
        HuggingFace CDN. Nothing in src/lionel/ imports it, and nothing may:
        DEP-002 governs the client this repository's own code calls, and httpx
        remains that client. Arrived with ADR-0036 at architecture 1.15.0.
      owner: core-orchestration
      unblocked_by: >-
        fastembed moving to httpx, or the embedding runtime being replaced. Until
        then this is a fact about a vendored library, not a choice this repository
        made -- and DEP-003 fails if fastembed ever leaves the lock while this
        entry stays.
    - package: httpx2
      pulled_by: anthropic
      why: >-
        anthropic depends on httpx2 directly (httpx's own in-progress v2, published
        as a separate distribution) for its transport. Nothing in src/lionel/
        imports it, and nothing may: DEP-002 governs the client this repository's
        own code calls, and httpx (v1) remains that client. Arrived with ADR-0040
        at architecture 1.23.0.
      owner: brain
      unblocked_by: >-
        anthropic moving to httpx (v1) or this repository replacing the anthropic
        SDK. Until then this is a fact about a vendored library, not a choice this
        repository made -- and DEP-003 fails if anthropic ever leaves the lock
        while this entry stays.

shell:
  require_strict_mode: true              # set -euo pipefail
  require_lf_endings: true               # CRLF in a .sh fails with \r: command not found
  forbid_patterns:
    - id: SH-CURLPIPE
      regex: "curl[^|]*\\|\\s*(ba)?sh"
      why: "Piping a download straight into a shell executes unverified remote code."
    - id: SH-RMRF-ROOT
      regex: "rm\\s+-rf\\s+/(\\s|$)"
      why: "Unbounded recursive delete from root."
    - id: SH-EVAL
      regex: "\\beval\\s+\"?\\$"
      why: "eval on a variable is command injection waiting for the right input."
    # ── MASTER_PLAN_v1 §2, the Git Bash / Windows hazard table ──────────────
    # v2 Phase 1 carries these forward. Three of the seven rows are statically
    # checkable in this repository's own scripts; the rest describe operator
    # behaviour at a terminal and are recorded in scripts/check_env.sh instead.
    # CRLF is already SH-CRLF above — that row was enforced from the start.
    - id: SH-BARE-PYTHON
      regex: '^(?!.*\b(uvx|uv run)\b).*(?<![\w./-])(python|pip)(?![\w.-])'
      why: >-
        On Windows `python` resolves to the Microsoft Store stub, which exits 9009
        and opens the Store instead of running anything. MASTER_PLAN_v1 §2: use
        `python3`, or `uv run` and let uv own the interpreter. Lines that already
        go through `uv run` or `uvx` are exempt, because there uv chose the
        interpreter and the stub is not on the path being used.
    - id: SH-MSYS-DOCKER
      regex: '^(?!.*MSYS_NO_PATHCONV).*\bdocker\b.*\s/[A-Za-z]'
      why: >-
        Git Bash rewrites a container-side absolute path into a Windows one before
        Docker ever sees it — `/qdrant/storage` becomes `C:/Program Files/Git/qdrant/storage`
        and the mount silently lands somewhere else. MASTER_PLAN_v1 §2: prefix with
        `MSYS_NO_PATHCONV=1`, or double the leading slash (`//qdrant/storage`).

architecture:
  # ADR-0009: callers branch on ProviderCapabilities, never on provider identity.
  provider_names: [anthropic, ollama, llamacpp]
  # tests/: a unit test for ONE adapter must import that adapter directly to test it --
  # that is not the ADR-0001 hazard (a runtime CALLER whose behaviour forks per provider).
  # Missing until the first adapter (ollama, ADR-0040) needed a test file to prove it.
  provider_branch_allowed_dirs: ["src/lionel/brain/providers", "contracts", "ci", "docs", "evals", "tests"]
  # ADR-0006: the control plane never carries media payload.
  control_plane_dirs: ["contracts/mcp", "contracts/events", "contracts/core"]
  media_payload_keys: ["payload_b64", "payload", "pcm", "audio_bytes"]
  # ADR-0012: metadata that must never reach a remote peer.
  mcp_tool_forbidden_fields: [side_effect, trust_required, rate_limit_per_minute, audit, idempotency_key_param]
  # ADR-0007: L0 is the autonomy guarantee.
  l0_tier_file: config/tiers/l0.toml
  l0_forbidden_providers: [anthropic]
  l0_required_settings:
    network_allowed: "false"

markdown:
  # MASTER_PLAN_v1.md is a frozen historical record, preserved verbatim by decision.
  # Linting it would mean editing it, which would destroy the thing it exists to be.
  exempt_paths:
    - MASTER_PLAN_v1.md
  exempt_reasons:
    MASTER_PLAN_v1.md: "frozen historical record, preserved verbatim"
  check_internal_links: true
  check_heading_hierarchy: true
  forbid_trailing_whitespace: true
  max_heading_jump: 1

# ─────────────────────────────────────────────────────────────────────────────
# L0 CONFORMANCE — ADR-0007. The offline autonomy guarantee.
# This section belongs to gate_l0_conformance.py alone. No other gate reads it.
# ─────────────────────────────────────────────────────────────────────────────
l0:
  tier_file: config/tiers/l0.toml
  # Settings that MUST hold in the L0 tier config, exactly.
  required_settings:
    network_allowed: "false"
    mtls_required: "false"      # no network boundary exists to protect
  # Providers that declare requires_network and therefore cannot serve L0.
  forbidden_providers: [anthropic]
  # Every L0 service must be in-process. A URL means a network hop.
  required_service_placement: inproc
  # Runtime surface examined for hidden shell execution (ADR-0011).
  runtime_surface: ["src/lionel", "config"]
  shell_execution_patterns:
    - "shell\\s*=\\s*True"
    - "os\\.system\\s*\\("
    - "subprocess\\.(call|run|Popen|check_output)\\s*\\([^)]*shell"
    - "\\bcommands\\.getoutput\\("
    - "\\beval\\s*\\(\\s*[\"']?\\$"
    - "curl[^|]*\\|\\s*(ba)?sh"
  # Config reachable by the L0 runtime. Images here must be digest-pinned.
  l0_reachable_config: ["config/tiers/l0.toml", "config/lionel.toml", "config/capabilities.registry.json"]
  mutable_tags: [latest, main, master, dev, edge, stable]
  # Contracts the L0 turn loop depends on.
  required_contracts:
    - contracts/events/v1/trust-context.schema.json
    - contracts/events/v1/cancellation.schema.json
    - contracts/mcp/v1/tool-call.schema.json
    - contracts/mcp/v1/tool-result.schema.json
    - contracts/mcp/v1/policy-ruleset.schema.json
    - contracts/media/v1/audio-frame.schema.json
  control_plane_dirs: ["contracts/mcp", "contracts/events", "contracts/core"]
  media_payload_keys: [payload_b64, payload, pcm, audio_bytes, raw_audio]

# ─────────────────────────────────────────────────────────────────────────────
# DOC QUOTES — a document that quotes a file must agree with that file.  ADR-0035.
#
# ADR-0033 closed count-shaped claims. This closes the half of the remainder that
# can be closed mechanically: a fenced block in a configuration language must
# appear verbatim in a repository file, or say that it is not a quotation.
#
# `documents` is a GLOB, not a list, so it cannot go stale as ADRs are added.
# That is also why this is not folded into `doc_claims`, whose registry is
# region-scoped over three named documents and whose corpus is the pipeline's own
# measurements rather than every file in the repository.
# ─────────────────────────────────────────────────────────────────────────────
doc_quotes:
  documents:
    - "docs/decisions/ADR-*.md"
    - "Architecture_Freeze.md"
  # Configuration languages only. A `bash` block is a command someone runs, not a
  # quotation, and `text` is prose in a box.
  languages: [toml, json, yaml, yml, proto]
  # A single line is an identifier or a path, not a quotation worth checking.
  min_lines: 2
  # An HTML comment: invisible in every markdown renderer, visible to this gate.
  # The reason after it is required — QUOTE-002 — and QUOTE-003 fails it once the
  # block starts matching a file, so it cannot outlive its reason.
  marker: "lionel:illustration"

# ─────────────────────────────────────────────────────────────────────────────
# PREFLIGHT — the host tooling table.  ADR-0002, ADR-0014.
#
# MASTER_PLAN_v1 §1.1 is a table of six tools a human was expected to check by
# hand, and MASTER_PLAN_v2 Phase 1 carries it forward verbatim: "the tooling
# preflight table, the Git Bash hazard rules". A table nobody executes is the
# same failure this pipeline exists to prevent, so `scripts/check_env.sh` runs
# it and this is where it lives.
#
# NO GATE READS THIS SECTION. The preflight describes the HOST, and a gate that
# failed CI because a developer's machine lacked VS Build Tools would be
# checking the wrong thing entirely — CI is not the host runtime. It is read by
# scripts/check_env.sh and by tests/unit/test_preflight.py, which checks the
# table's shape rather than the machine's contents.
#
# required_at:
#   now        blocking. `check_env.sh` exits 1 without it.
#   G<n>       needed by that gate's phase, not before. Reported, never blocking.
#              A row here is a promise to the future with a date on it.
# ─────────────────────────────────────────────────────────────────────────────
preflight:
  tools:
    - id: git
      minimum: "2.40"
      probe: "git --version"
      extract: '([0-9]+\.[0-9]+(\.[0-9]+)?)'
      required_at: now
      why: "Versioning, and the submodule that carries whisper.cpp from G6."
    - id: python3
      minimum: "3.11"
      probe: "python3 --version"
      extract: '([0-9]+\.[0-9]+(\.[0-9]+)?)'
      required_at: now
      why: "Every gate, every script and the test suite. 3.11 is the floor tomllib sets."
    - id: node
      minimum: "20.0"
      probe: "node --version"
      extract: '([0-9]+\.[0-9]+(\.[0-9]+)?)'
      required_at: now
      why: "npx launches the filesystem capability and the ADR-0032 dev-tooling servers."
    - id: uv
      minimum: "0.5"
      probe: "uv --version"
      extract: '([0-9]+\.[0-9]+(\.[0-9]+)?)'
      required_at: now
      why: "Owns the interpreter and reproduces uv.lock. Bare `python` is a Store stub."
    - id: docker
      minimum: "24.0"
      probe: "docker --version"
      extract: '([0-9]+\.[0-9]+(\.[0-9]+)?)'
      required_at: now
      why: "Runs the digest-pinned GitHub MCP server (ADR-0013); Qdrant from G2."
    - id: cl
      minimum: "19.0"
      probe: "cl"
      extract: '([0-9]+\.[0-9]+(\.[0-9]+)?)'
      required_at: G3
      why: >-
        VS Build Tools 2022, Desktop development with C++. Compiles
        llama-cpp-python at G3 (ADR-0040) and whisper.cpp at G6. `uv sync` fails
        for everyone from G3 onward, not only operators who select llamacpp as
        their runtime provider -- Python has no concept of "installed but not
        chosen." Only resolves inside a Developer Command Prompt, which is why
        this row is reported and never blocking.
  # Python packages the gates import. Absence is not a style problem: without
  # grpcio-tools the protobuf gate exits 2, and exit 2 is a BROKEN GATE, not a
  # passing repository (CI_Architecture §4).
  python_packages:
    - id: yaml
      distribution: pyyaml
      required_at: now
      why: "Every gate reads this file with it. Without it nothing below can be read."
    - id: jsonschema
      distribution: jsonschema
      required_at: now
      why: "gate_jsonschema and the contract test layer."
    - id: grpc_tools
      distribution: grpcio-tools
      required_at: now
      why: "gate_protobuf exits 2 without it — a broken gate reported as such."
    - id: psutil
      distribution: psutil
      required_at: now
      why: "ADR-0014. The kill-tree test cannot observe orphaned children without it."
  # Live checks that need the network or a credential. Never run by default:
  # ADR-0007 means the ordinary path must work with the cable pulled, and a
  # preflight that silently reached the internet would be the first thing to
  # break that promise. `check_env.sh --live` opts in, and says so before it does.
  #
  # The v1.0 DoD clause "the filesystem server lists the project root" splits in
  # two here. That the declared root EXISTS is a host fact, checked on every run —
  # it is how the stale Desktop path was found. That the server STARTS and refuses
  # to escape needs npx and a fetch, so it lives below.
  live_checks:
    - id: filesystem-escape
      why: >-
        v1.0 Phase 1 DoD: the filesystem capability starts, lists the project root,
        and REFUSES a read outside it. The refusal is the half worth testing — a
        server that lists the root and also lists C:/Windows has passed nothing.
    - id: github-identity
      why: >-
        v1.0 Phase 1 DoD: the digest-pinned GitHub MCP container starts and `get_me`
        returns Efe's login. Needs a fine-grained PAT resolved through ADR-0015,
        which is why it can never be part of an offline run.
  # ── The Git Bash / Windows hazard table ─────────────────────────────────────
  # MASTER_PLAN_v1 §2, seven rows, carried forward by MASTER_PLAN_v2's Phase 1
  # alongside the tooling table above. v1 introduces them with: "These bite on
  # every phase. Encoding them once here prevents four separate debugging
  # sessions." They were encoded once, in prose, in a superseded plan.
  #
  # Every row carries `enforced_by`, and there are only three legal values:
  #   <RULE-ID>   a gate rejects it and ci/self_test.sh proves the rule bites
  #   check_env   this preflight executes it against the host
  #   operator    it describes what a person types at a terminal. Nothing can
  #               check that from a file — so the row is PRINTED, at the moment
  #               the operator is setting the machine up and can act on it.
  #
  # `operator` is the honest label for "unenforceable", and it is capped: a row
  # that could be checked and is merely labelled `operator` is a silently lowered
  # standard. Two rows moved off it at 1.7.0 and two more at 1.8.0.
  hazards:
    - id: HAZ-MSYS-PATH
      hazard: >-
        Git Bash rewrites a container-side absolute path before Docker sees it:
        /qdrant/storage becomes C:/Program Files/Git/qdrant/storage, the mount
        lands somewhere else, and the container comes up empty rather than failing.
      rule: >-
        Prefix with MSYS_NO_PATHCONV=1, or double the leading slash (//qdrant/storage).
      enforced_by: SH-MSYS-DOCKER
    - id: HAZ-STORE-PYTHON
      hazard: >-
        On Windows the bare interpreter name resolves to the Microsoft Store stub,
        which exits 9009 and opens the Store instead of running anything.
      rule: >-
        Call python3, or use uv run and let uv own the interpreter.
      enforced_by: SH-BARE-PYTHON
    - id: HAZ-CRLF-SH
      hazard: >-
        A CRLF-terminated .sh fails on Linux with the cryptic message about \r not
        being a command, naming a line that looks perfectly correct.
      rule: >-
        .gitattributes pins * text=auto eol=lf. Never write a .sh with os.linesep.
      enforced_by: SH-CRLF
    - id: HAZ-DOCKER-BACKEND
      hazard: >-
        Docker Desktop on the Hyper-V backend gives unreliable bind-mount
        performance on the Qdrant volume, which surfaces at G2 as intermittent
        slowness rather than as an error anyone can act on.
      rule: >-
        Use the WSL2 backend. Checked against docker info KernelVersion.
      enforced_by: check_env
    - id: HAZ-HOST-MOUNT
      hazard: >-
        A host path in a volume mount needs a Windows-native form, and Bash will
        not produce one on its own.
      rule: >-
        Use $(pwd -W), or rely on docker-compose relative paths — Compose does the
        translation itself, which is why Compose is preferred over raw docker run.
      enforced_by: operator
    - id: HAZ-TTY
      hazard: >-
        Anything that prompts hangs with no output under Git Bash, because there is
        no console attached the way the program expects.
      rule: >-
        Prefix with winpty, e.g. winpty docker exec -it.
      enforced_by: operator
    - id: HAZ-BACKSLASH
      hazard: >-
        A backslash in a config or .env value is eaten by Bash as an escape, and the
        value that reaches the program is silently a different string.
      rule: >-
        Write Windows paths with forward slashes everywhere (ADR-0002). Python and
        Docker both accept them.
      enforced_by: ARCH-017

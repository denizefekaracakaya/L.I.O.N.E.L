# artifacts.lock.yaml — ADR-0013
#
# AUTHORITATIVE. Supersedes artifacts.lock.toml (retained as a deprecation pointer).
# scripts/verify_artifacts.sh is the G0 gate and FAILS CLOSED.
#
# ─────────────────────────────────────────────────────────────────────────────────
# VERIFICATION TIERS — read this before trusting any hash below
# ─────────────────────────────────────────────────────────────────────────────────
# A hash is not a hash. Where it came from determines what it actually proves, and a
# lockfile that flattens those differences grants false confidence. Every artifact
# declares a `verification.tier`:
#
#   A  PRIMARY-PUBLISHED
#      The authoritative upstream publishes the digest itself.
#      Proves: the file is what the project that produced it says it is.
#
#   B  MIRROR + SIZE-MATCHED
#      A third-party mirror publishes a SHA-256, AND the byte length matches the
#      authoritative upstream asset EXACTLY.
#      Proves: strong evidence of identity. NOT proof — two distinct files can share a
#      length. Treated as sufficient because the mirror is pinned as the actual source,
#      so what we fetch is what we hashed.
#
#   C  MIRROR + INDEPENDENT CORROBORATION
#      Two or more UNRELATED mirrors publish byte-identical SHA-256s for the same file.
#      Proves: strong. Independent uploaders converging on one hash is hard to fake and
#      unlikely by accident.
#
#   D  SINGLE MIRROR, UNCORROBORATED
#      One third-party mirror publishes a hash; no upstream size and no second source
#      to check it against.
#      Proves: reproducibility FROM THAT SOURCE only. It does NOT prove the file matches
#      what the upstream library would fetch. Acceptable only when the mirror is pinned
#      as the source of record and the risk is documented.
#
#   E  UNRESOLVED
#      No hash. Never a placeholder — a fabricated checksum is strictly worse than an
#      absent one, because it looks verified.
#
# ─────────────────────────────────────────────────────────────────────────────────
# STATUS: 14 of 14 artifacts reproducible. 0 UNRESOLVED.
# The G0 artifact criterion was MET at 13 of 13 (see Artifacts_Final_Report.md); artifact 14
# (eval_golden_read_a_file_ollama) was added under G3 (ADR-0041), after G0 closed.
# ─────────────────────────────────────────────────────────────────────────────────

meta:
  schema_version: 3
  format: yaml
  supersedes: artifacts.lock.toml
  updated: "2026-09-17"
  retrieval_date: "2026-08-02"
  resolved: 14
  unresolved: 0
  gate: "G0 blocks while unresolved > 0"
  report: Artifact_Verification_Report.md
  rules:
    - "Never invent a hash. UNRESOLVED is an honest state; a placeholder is not."
    - "Never substitute one artifact's digest for another's, even when sizes look close."
    - "Pin the source you actually fetch from. A hash for a mirror you do not use proves nothing."

